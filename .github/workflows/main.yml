name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies & Build web app
        run: |
          cd frontend
          npm install
          npm run build

      - name: Generate APK using PWABuilder CLI
        run: |
          npx @pwabuilder/pwapush --manifest ./frontend/public/manifest.json --platform android
