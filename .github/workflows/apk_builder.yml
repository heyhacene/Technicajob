name: Build Android APK Package

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install || true

      - name: Prepare Mobile Package
        run: |
          mkdir -p mobile-build
          # Copie l'ensemble des fichiers du projet pour le packaging
          cp -r * mobile-build/ 2>/dev/null || true

      - name: Upload Mobile Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: technicajob-mobile-package
          path: mobile-build/
