name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Build Android APK (Capacitor / Cordova / Web export)
        run: |
          # Commande de build APK ou compilation web intégrée
          mkdir -p build-output
          cp -r dist/* build-output/ || cp -r build/* build-output/ || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: technicajob-apk
          path: build-output/
