name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Set up Java (for Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Add Capacitor & Build Android
        run: |
          # Installation des outils Capacitor si ce n'est pas déjà fait
          npm install @capacitor/cli @capacitor/core @capacitor/android --save
          
          # Initialisation de Capacitor pour créer le projet Android
          npx cap init Technicajob com.technicajob.app --web-dir . --yes || true
          npx cap add android || true
          npx cap sync

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: technicajob-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
