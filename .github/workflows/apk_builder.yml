name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Prepare App Output
        run: |
          mkdir -p build-output
          # Copie l'ensemble des fichiers du dépôt dans le dossier de sortie
          find . -maxdepth 1 ! -name '.' ! -name '.git' -exec cp -r {} build-output/ \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: technicajob-files
          path: build-output/
