name: Build Android APK (Capacitor)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java (Temurin JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install dependencies (Frontend)
        working-directory: frontend
        run: npm ci

      - name: Build web application
        working-directory: frontend
        run: npm run build

      - name: Add/Sync Capacitor Android
        working-directory: frontend
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Make Gradle executable
        run: chmod +x frontend/android/gradlew

      - name: Build Android Debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK for Release
        run: |
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk TechnicAtome-Jobs.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: TechnicAtome-Jobs.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release (Direct Download)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Veille TechnicAtome v1.0.${{ github.run_number }}"
          body: |
            ### 📱 Application Veille Offres TechnicAtome
            Cliquez directement sur **TechnicAtome-Jobs.apk** ci-dessous pour installer l'application sur votre smartphone Android.

            - **Lien direct APK permanent** : https://github.com/heyhacene/Technicajob/releases/latest/download/TechnicAtome-Jobs.apk
            - Suivi en temps réel des offres d'emploi TechnicAtome
            - Filtres par mot-clé, lieu, contrat et domaine
            - Alerte des nouvelles offres non lues
          files: |
            TechnicAtome-Jobs.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
