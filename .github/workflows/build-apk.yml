name: Build Android APK (Capacitor)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java (Temurin JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install dependencies (Frontend)
        working-directory: frontend
        run: npm install

      - name: Build web application
        working-directory: frontend
        run: npm run build

      - name: Add/Sync Capacitor Android
        working-directory: frontend
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Make Gradle executable
        run: chmod +x frontend/android/gradlew

      - name: Build Android APK (Release)
        working-directory: frontend/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign & Align APK
        run: |
          UNSIGNED_APK="frontend/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$UNSIGNED_APK" ]; then
            UNSIGNED_APK="frontend/android/app/build/outputs/apk/debug/app-debug.apk"
          fi

          APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools $ANDROID_HOME/build-tools /usr/local/lib/android/sdk/build-tools -name apksigner 2>/dev/null | sort -V | tail -n 1)
          ZIPALIGN=$(find $ANDROID_SDK_ROOT/build-tools $ANDROID_HOME/build-tools /usr/local/lib/android/sdk/build-tools -name zipalign 2>/dev/null | sort -V | tail -n 1)

          if [ -n "$ZIPALIGN" ] && ! $ZIPALIGN -c 4 "$UNSIGNED_APK"; then
            $ZIPALIGN -p -f 4 "$UNSIGNED_APK" aligned.apk
            UNSIGNED_APK="aligned.apk"
          fi

          KEYSTORE="keystore/app.keystore"
          $APKSIGNER sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "keonote" \
            --ks-pass "pass:keonotepassword" \
            --key-pass "pass:keonotepassword" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out TechnicAtome-Jobs.apk \
            "$UNSIGNED_APK"

          $APKSIGNER verify --verbose TechnicAtome-Jobs.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TechnicAtome-Jobs-APK
          path: TechnicAtome-Jobs.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Veille TechnicAtome v1.0.${{ github.run_number }}"
          body: |
            ### 📱 Veille Offres TechnicAtome
            Application signée prête pour l'installation sur smartphones et tablettes Android.
          files: |
            TechnicAtome-Jobs.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
